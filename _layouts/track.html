<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/sysid2027.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="site-title">{{ page.band_title }}</span>
      <a class="site-band-link" href="{{ page.conference_url }}">{{ page.band_venue }}</a>
    </div>
  </header>
  <main class="main-content">
    <div class="container">
      <article class="page">
        <header class="page-header">
          <h1 class="page-title">{{ page.track_title }}</h1>
          <p class="track-venue">Open invited track at the
            <a href="{{ page.conference_url }}">{{ page.conference_name }}</a><br>
            {{ page.conference_dates }} &middot; {{ page.conference_place }}</p>
        </header>
        <div class="page-content">
          {{ content }}
        </div>
      </article>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <p><a href="{{ page.conference_url }}">{{ page.conference_name }}</a></p>
        <p>Contact: <a href="mailto:{{ page.contact_email }}">{{ page.contact_email }}</a></p>
      </div>
    </div>
  </footer>
</body>
</html>
